<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="page-title-meta">Crew Break Attendance System</title>
  
  <!-- Tailwind CSS -->

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f8fafc',
              100: '#f1f5f9',

              900: '#020617',

          fontFamily: {

    }
  </script>

  <!-- Google Fonts: Inter -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Html5-Qrcode -->

  <!-- XLSX -->

  <style>
    body {
      font-family: 'Inter', sans-serif;

    }
    .custom-scrollbar::-webkit-scrollbar {

      height: 6px;
    }

      background: #f1f5f9;

    html.dark .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    html.dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-barcode-card, #printable-barcode-card * {
        visibility: visible;
      }
      #printable-barcode-card {
        position: absolute;
        left: 0;
        top: 0;

</head>
<body class="h-full flex flex-col text-slate-800 dark:text-slate-100 bg-slate-50 dark:bg-slate-900 antialiased selection:bg-slate-700 selection:text-white transition-colors duration-200">

  <div id="app" class="min-h-screen flex flex-col flex-1">
    <!-- UI dynamic -->
  </div>

  <script>
    const APP_STATE = {
      currentUser: null,
      activeTab: 'dashboard',
      theme: localStorage.getItem('cba_theme') || 'light',
      accentColor: localStorage.getItem('cba_accent') || 'slate',
      crews: [],
      breaks: [],
      breakTypes: [],
      admins: [],
      requests: [],
      statuses: [],
      settings: {
        appTitle: localStorage.getItem('cba_app_title') || 'Crew Break Attendance System',
        appDescription: localStorage.getItem('cba_app_desc') || 'Portal scanning & monitoring istirahat crew operasional.',
        companyName: localStorage.getItem('cba_company') || 'Kedai Kopi Utama',
        companyLogo: localStorage.getItem('cba_company_logo') || '',
      },
      scanner: null,
      activeScanResult: null,
      searchQuery: '',
      historyFilters: { date: '', crewId: '', breakType: '', status: '' }
    };

    let timerInterval = null;

    function getAccentClasses() {
      const map = {
        slate: {
          bg: 'bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600',
          text: 'text-slate-900 dark:text-white',
          border: 'border-slate-900 dark:border-slate-600',
          ring: 'focus:ring-slate-600',
          badge: 'bg-slate-100 text-slate-800 dark:bg-slate-700 dark:text-slate-200'
        },
        emerald: {
          bg: 'bg-emerald-700 hover:bg-emerald-800',
          text: 'text-emerald-700 dark:text-emerald-400',
          border: 'border-emerald-600',
          ring: 'focus:ring-emerald-600',
          badge: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300'
        },
        indigo: {
          bg: 'bg-indigo-600 hover:bg-indigo-700',
          text: 'text-indigo-600 dark:text-indigo-400',
          border: 'border-indigo-600',
          ring: 'focus:ring-indigo-600',
          badge: 'bg-indigo-100 text-indigo-800 dark:bg-indigo-900/40 dark:text-indigo-300'
        },
        amber: {
          bg: 'bg-amber-600 hover:bg-amber-700',
          text: 'text-amber-600 dark:text-amber-400',
          border: 'border-amber-600',
          ring: 'focus:ring-amber-600',
          badge: 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300'
        },
        rose: {
          bg: 'bg-rose-600 hover:bg-rose-700',
          text: 'text-rose-600 dark:text-rose-400',
          border: 'border-rose-600',
          ring: 'focus:ring-rose-600',
          badge: 'bg-rose-100 text-rose-800 dark:bg-rose-900/40 dark:text-rose-300'
        }
      };
      return map[APP_STATE.accentColor] || map.slate;
    }

    function initSeedData() {
      applyTheme();
      updateMetaTitle();

      const isInitialized = localStorage.getItem('cba_initialized');

      const initialBreakTypes = [
        { id: 'bt_1', name: 'Meal Break', maxMinutes: 45 },
        { id: 'bt_2', name: 'Short Break', maxMinutes: 15 },
        { id: 'bt_3', name: 'Personal Break', maxMinutes: 10 },
        { id: 'bt_4', name: 'Prayer Break', maxMinutes: 20 },
      ];

      const initialCrews = [
        { id: 'crw_1', crewId: 'CRW001', name: 'Budi Santoso', gender: 'Laki-laki', position: 'Senior Barista', department: 'Service', phone: '081234567890', photo: '', password: 'CRW001', status: 'Active', createdAt: '2026-01-10' },
        { id: 'crw_2', crewId: 'CRW002', name: 'Siti Rahma', gender: 'Perempuan', position: 'Cashier', department: 'Front Desk', phone: '081298765432', photo: '', password: 'CRW002', status: 'Active', createdAt: '2026-01-12' },
        { id: 'crw_3', crewId: 'CRW003', name: 'Andi Wijaya', gender: 'Laki-laki', position: 'Kitchen Crew', department: 'Kitchen', phone: '081355554444', photo: '', password: 'CRW003', status: 'Active', createdAt: '2026-02-01' },
      ];

      const initialAdmins = [
        { id: 'adm_1', email: 'manager@email.com', password: 'password123', name: 'Utama Manager', role: 'Super Admin', phone: '08123456789', createdAt: '2026-01-01' },
        { id: 'adm_2', email: 'supervisor@email.com', password: 'password123', name: 'Siti Supervisor', role: 'Shift Leader', phone: '08198765432', createdAt: '2026-01-05' }
      ];

      const initialStatuses = [
        { id: 'st_1', authorName: 'Utama Manager', authorRole: 'Admin', avatar: '', text: 'Semangat untuk tim shift sore hari ini! Pastikan istirahat tepat waktu.', photo: '', createdAt: new Date().toISOString() }
      ];

      if (!isInitialized) {
        localStorage.setItem('cba_crews', JSON.stringify(initialCrews));
        localStorage.setItem('cba_breaks', JSON.stringify([]));
        localStorage.setItem('cba_breakTypes', JSON.stringify(initialBreakTypes));
        localStorage.setItem('cba_admins', JSON.stringify(initialAdmins));
        localStorage.setItem('cba_requests', JSON.stringify([]));
        localStorage.setItem('cba_statuses', JSON.stringify(initialStatuses));
        localStorage.setItem('cba_initialized', 'true');
      }

      APP_STATE.crews = JSON.parse(localStorage.getItem('cba_crews') || '[]');
      APP_STATE.breaks = JSON.parse(localStorage.getItem('cba_breaks') || '[]');
      APP_STATE.breakTypes = JSON.parse(localStorage.getItem('cba_breakTypes') || '[]');
      APP_STATE.admins = JSON.parse(localStorage.getItem('cba_admins') || '[]');
      APP_STATE.requests = JSON.parse(localStorage.getItem('cba_requests') || '[]');
      APP_STATE.statuses = JSON.parse(localStorage.getItem('cba_statuses') || '[]');

      const storedUser = localStorage.getItem('cba_user');
      APP_STATE.currentUser = storedUser ? JSON.parse(storedUser) : null;
    }

    function saveData() {
      localStorage.setItem('cba_crews', JSON.stringify(APP_STATE.crews));
      localStorage.setItem('cba_breaks', JSON.stringify(APP_STATE.breaks));
      localStorage.setItem('cba_breakTypes', JSON.stringify(APP_STATE.breakTypes));
      localStorage.setItem('cba_admins', JSON.stringify(APP_STATE.admins));
      localStorage.setItem('cba_requests', JSON.stringify(APP_STATE.requests));
      localStorage.setItem('cba_statuses', JSON.stringify(APP_STATE.statuses));
      localStorage.setItem('cba_theme', APP_STATE.theme);
      localStorage.setItem('cba_accent', APP_STATE.accentColor);
      localStorage.setItem('cba_app_title', APP_STATE.settings.appTitle);
      localStorage.setItem('cba_app_desc', APP_STATE.settings.appDescription);
      localStorage.setItem('cba_company', APP_STATE.settings.companyName);
      localStorage.setItem('cba_company_logo', APP_STATE.settings.companyLogo || '');
      
      if (APP_STATE.currentUser) {
        localStorage.setItem('cba_user', JSON.stringify(APP_STATE.currentUser));
      } else {
        localStorage.removeItem('cba_user');
      }
      updateMetaTitle();
    }

    function updateMetaTitle() {
      const el = document.getElementById('page-title-meta');
      if (el) el.innerText = APP_STATE.settings.appTitle;
    }

    function applyTheme() {
      if (APP_STATE.theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      localStorage.setItem('cba_theme', APP_STATE.theme);
    }

    function toggleTheme() {
      APP_STATE.theme = APP_STATE.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      renderApp();
      showToast(`Mode ${APP_STATE.theme === 'dark' ? 'Gelap' : 'Terang'} diaktifkan`, 'info');
    }

    function setAccentColor(colorName) {
      APP_STATE.accentColor = colorName;
      saveData();
      renderApp();
      showToast(`Tema warna diubah ke ${colorName}`, 'success');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container') || createToastContainer();
      const toast = document.createElement('div');
      
      const bgColors = {
        success: 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900',
        error: 'bg-rose-700 text-white',
        warning: 'bg-amber-600 text-white',
        info: 'bg-slate-700 text-white'
      };

      const icons = {
        success: 'fa-circle-check',
        error: 'fa-triangle-exclamation',
        warning: 'fa-circle-exclamation',
        info: 'fa-circle-info'
      };

      toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl transform transition-all duration-300 translate-y-2 opacity-0 text-sm font-medium ${bgColors[type] || bgColors.info}`;
      toast.innerHTML = `
        <i class="fa-solid ${icons[type] || icons.info} text-base"></i>
        <span>${message}</span>
      `;

      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function createToastContainer() {
      const container = document.createElement('div');
      container.id = 'toast-container';
      container.className = 'fixed bottom-20 md:bottom-6 right-4 left-4 md:left-auto md:w-96 z-50 flex flex-col gap-2 pointer-events-none';
      document.body.appendChild(container);
      return container;
    }

    function formatTime(isoString) {
      if (!isoString) return '-';
      const d = new Date(isoString);
      return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined || isNaN(seconds)) return '-';
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = Math.floor(seconds % 60);
      const pad = (n) => n.toString().padStart(2, '0');
      if (hrs > 0) return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
      return `${pad(mins)}:${pad(secs)}`;
    }

    function getElapsedTimeInSeconds(startTimeIso) {
      const start = new Date(startTimeIso).getTime();
      const now = new Date().getTime();
      return Math.max(0, Math.floor((now - start) / 1000));
    }

    function startLiveTimers() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        document.querySelectorAll('.live-timer').forEach(el => {
          const startTime = el.getAttribute('data-start');
          if (startTime) el.innerText = formatDuration(getElapsedTimeInSeconds(startTime));
        });
      }, 1000);
    }

    /* ================= LOGIN VIEW ================= */
    let currentLoginRole = 'admin';

    function setLoginRole(role) {
      currentLoginRole = role;
      const adminBtn = document.getElementById('role-admin-btn');
      const crewBtn = document.getElementById('role-crew-btn');
      const helpText = document.getElementById('login-help-text');
      const identityLabel = document.getElementById('identity-label');
      const identityInput = document.getElementById('login-identity');

      if (role === 'admin') {
        adminBtn.className = 'flex-1 py-2 font-bold rounded-xl text-xs bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow transition';
        crewBtn.className = 'flex-1 py-2 font-bold rounded-xl text-xs text-slate-500 hover:text-slate-900 dark:hover:text-white transition';
        if (helpText) helpText.innerText = 'Login Admin dengan Email terdaftar';
        if (identityLabel) identityLabel.innerText = 'Email Admin';
        if (identityInput) { identityInput.placeholder = 'admin@email.com'; identityInput.value = 'manager@email.com'; }
      } else {
        crewBtn.className = 'flex-1 py-2 font-bold rounded-xl text-xs bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow transition';
        adminBtn.className = 'flex-1 py-2 font-bold rounded-xl text-xs text-slate-500 hover:text-slate-900 dark:hover:text-white transition';
        if (helpText) helpText.innerText = 'Login Crew dengan ID Crew / No HP (Default pass: ID Crew)';
        if (identityLabel) identityLabel.innerText = 'ID Crew / No HP';
        if (identityInput) { identityInput.placeholder = 'CRW001'; identityInput.value = 'CRW001'; }
      }
    }

    function renderLoginView() {
      const accent = getAccentClasses();
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
          <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-3xl shadow-2xl p-8 border border-slate-200 dark:border-slate-700">
            <div class="text-center mb-6">
              ${APP_STATE.settings.companyLogo ? `
                <img src="${APP_STATE.settings.companyLogo}" alt="Logo" class="w-16 h-16 object-cover rounded-2xl mx-auto mb-4 shadow-md border border-slate-200 dark:border-slate-700">
              ` : `
                <div class="w-16 h-16 ${accent.bg} rounded-2xl flex items-center justify-center mx-auto mb-4 text-white shadow-lg">
                  <i class="fa-solid fa-mug-hot text-2xl"></i>
                </div>
              `}
              <h1 class="text-2xl font-bold text-slate-900 dark:text-white">${APP_STATE.settings.appTitle}</h1>
              <p id="login-help-text" class="text-xs text-slate-500 dark:text-slate-400 mt-1">Pilih peran login Anda di bawah</p>
            </div>

            <!-- Role Switcher -->
            <div class="flex p-1 bg-slate-100 dark:bg-slate-900 rounded-2xl mb-6 border border-slate-200 dark:border-slate-700">
              <button type="button" id="role-admin-btn" onclick="setLoginRole('admin')" class="flex-1 py-2 font-bold rounded-xl text-xs bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow transition">
                <i class="fa-solid fa-user-shield mr-1"></i> Admin Portal
              </button>
              <button type="button" id="role-crew-btn" onclick="setLoginRole('crew')" class="flex-1 py-2 font-bold rounded-xl text-xs text-slate-500 hover:text-slate-900 dark:hover:text-white transition">
                <i class="fa-solid fa-users mr-1"></i> Crew Portal
              </button>
            </div>

            <form onsubmit="handleUnifiedLogin(event)" class="space-y-4">
              <div>
                <label id="identity-label" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">Email Admin</label>
                <input 
                  type="text" 
                  id="login-identity" 
                  required 
                  value="manager@email.com"
                  class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 ${accent.ring} text-slate-800 dark:text-slate-100 text-sm font-medium transition"
                  placeholder="admin@email.com"
                >
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">Password / Sandi</label>
                <div class="relative">
                  <input 
                    type="password" 
                    id="login-password" 
                    required 
                    value="password123"
                    class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 ${accent.ring} text-slate-800 dark:text-slate-100 text-sm font-medium transition pr-12"
                    placeholder="••••••••"
                  >
                  <button 
                    type="button" 
                    onclick="togglePasswordVisibility('login-password', 'login-eye-icon')" 
                    class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition"
                  >
                    <i id="login-eye-icon" class="fa-solid fa-eye text-sm"></i>
                  </button>
                </div>
              </div>

              <div class="flex items-center justify-between text-xs">
                <span class="text-slate-400 text-[11px]">Sistem Keamanan Aktif</span>
                <button type="button" onclick="openForgotPasswordModal()" class="font-bold text-slate-700 dark:text-slate-300 hover:underline">Lupa Password?</button>
              </div>

              <button 
                type="submit" 
                class="w-full py-3.5 ${accent.bg} text-white font-semibold rounded-xl shadow-lg transition active:scale-[0.99] flex items-center justify-center gap-2"
              >
                <span>Masuk Portal</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function handleUnifiedLogin(e) {
      e.preventDefault();
      const identity = document.getElementById('login-identity').value.trim();
      const password = document.getElementById('login-password').value.trim();

      if (currentLoginRole === 'admin') {
        const foundAdmin = APP_STATE.admins.find(a => a.email.toLowerCase() === identity.toLowerCase());
        if (foundAdmin) {
          if (foundAdmin.password === password) {
            APP_STATE.currentUser = { ...foundAdmin, roleType: 'admin' };
            APP_STATE.activeTab = 'dashboard';
            saveData();
            showToast(`Selamat datang Admin, ${foundAdmin.name}!`, 'success');
            renderApp();
          } else {
            showToast('Password Admin salah!', 'error');
          }
        } else {
          showToast('Email Admin tidak terdaftar!', 'error');
        }
      } else {
        const foundCrew = APP_STATE.crews.find(c => c.crewId.toLowerCase() === identity.toLowerCase() || c.phone === identity);
        if (foundCrew) {
          const effectivePass = foundCrew.password || foundCrew.crewId;
          if (password === effectivePass) {
            APP_STATE.currentUser = { ...foundCrew, roleType: 'crew' };
            APP_STATE.activeTab = 'crew_dashboard';
            saveData();
            showToast(`Selamat datang Crew, ${foundCrew.name}!`, 'success');
            renderApp();
          } else {
            showToast('Password Crew salah! (Default: ID Crew)', 'error');
          }
        } else {
          showToast('ID Crew / No HP tidak ditemukan!', 'error');
        }
      }
    }

    function handleLogout() {
      if (APP_STATE.scanner) stopScanner();
      APP_STATE.currentUser = null;
      saveData();
      showToast('Anda telah logout.', 'info');
      renderApp();
    }

    function openForgotPasswordModal() {
      const modal = document.createElement('div');
      modal.id = 'dynamic-modal';
      modal.className = 'fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4';
      modal.innerHTML = `
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl border border-slate-200 dark:border-slate-700">
          <div class="text-center">
            <div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 flex items-center justify-center mx-auto mb-3">
              <i class="fa-solid fa-key text-lg"></i>
            </div>
            <h3 class="font-bold text-lg text-slate-900 dark:text-white">Pemulihan Password</h3>
            <p class="text-xs text-slate-500 mt-1">Bagi Crew, pengajuan ubah password akan dikirimkan ke Admin untuk disetujui.</p>
          </div>

          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold uppercase text-slate-600 dark:text-slate-300 mb-1">Email / ID Crew / No WA</label>
              <input type="text" id="recovery-target" placeholder="admin@email.com atau CRW001" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs">
            </div>

            <button onclick="sendRecoveryRequest()" class="w-full py-3 bg-slate-900 text-white font-bold rounded-xl text-xs transition">
              Kirim Instruksi Pemulihan
            </button>
          </div>

          <button onclick="document.getElementById('dynamic-modal').remove()" class="w-full py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold rounded-xl text-xs mt-1">Batal</button>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function sendRecoveryRequest() {
      const target = document.getElementById('recovery-target').value.trim();
      document.getElementById('dynamic-modal').remove();
      if (!target) return;

      const crew = APP_STATE.crews.find(c => c.crewId.toLowerCase() === target.toLowerCase() || c.phone === target);
      if (crew) {
        APP_STATE.requests.unshift({
          id: 'req_' + Date.now(),
          crewId: crew.crewId,
          crewName: crew.name,
          type: 'PASSWORD_RESET',
          description: `Permintaan Reset Password untuk ID ${crew.crewId}`,
          newValue: crew.crewId, // reset back to default ID
          status: 'PENDING',
          date: new Date().toISOString().split('T')[0]
        });
        saveData();
        showToast('Permintaan reset password telah diajukan ke Admin!', 'success');
      } else {
        showToast('Kontak/ID terkirim. Admin akan memeriksa log.', 'info');
      }
    }

    /* ================= NAVIGATION ================= */
    function renderNavigation() {
      const active = APP_STATE.activeTab;
      const isAdmin = APP_STATE.currentUser.roleType === 'admin';
      const activeBreaksCount = APP_STATE.breaks.filter(b => b.status === 'ON BREAK').length;

              >

              </button>

    function startCameraScanner() {
      if (APP_STATE.scanner) {
        stopScanner();
        return;
      }
      const html5QrcodeScanner = new Html5Qrcode("reader");
      APP_STATE.scanner = html5QrcodeScanner;
      const btnText = document.getElementById('cam-btn-text');
      if (btnText) btnText.innerText = 'Matikan Kamera';

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          if (navigator.vibrate) navigator.vibrate(100);
          processScanBarcode(decodedText);
          stopScanner();
        },
        () => {}
      ).catch(() => {
        showToast("Gagal mengakses kamera. Gunakan input ID manual.", "error");
        if (btnText) btnText.innerText = 'Buka Kamera';
        APP_STATE.scanner = null;
      });
    }

    function stopScanner() {
      if (APP_STATE.scanner) {
        APP_STATE.scanner.stop().then(() => {
          APP_STATE.scanner = null;
          const btnText = document.getElementById('cam-btn-text');
          if (btnText) btnText.innerText = 'Buka Kamera';
        }).catch(() => {});
      }
    }

    function renderScanResultCard(crew) {
      if (!crew) return '';
      const activeBreak = APP_STATE.breaks.find(b => b.crewId === crew.crewId && b.status === 'ON BREAK');
      const accent = getAccentClasses();

      if (activeBreak) {
        return `
          <div class="bg-amber-50 dark:bg-amber-950/40 rounded-3xl border-2 border-amber-300 p-6 shadow-xl space-y-4">

            </button>
          </div>
        `;
      } else {
        return `
          <div class="bg-white dark:bg-slate-800 rounded-3xl border-2 border-slate-300 dark:border-slate-700 p-6 shadow-xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">
              <div class="flex items-center gap-3">
                ${crew.photo ? `<img src="${crew.photo}" class="w-12 h-12 object-cover rounded-xl">` : `
                <div class="w-12 h-12 rounded-xl ${accent.bg} text-white flex items-center justify-center font-bold">
                  <i class="fa-solid fa-user"></i>
                </div>`}
                <div>
                  <span class="px-2 py-0.5 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 text-[10px] font-bold rounded-md uppercase">Siap Break</span>
                  <h3 class="text-lg font-extrabold text-slate-900 dark:text-white">${crew.name}</h3>
                  <p class="text-xs text-slate-500">${crew.position} (${crew.crewId})</p>
                </div>
              </div>
              <button onclick="clearScanResult()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase text-slate-700 dark:text-slate-300 mb-2">Pilih Jenis Break:</label>
              <div class="grid grid-cols-2 gap-2">
                ${APP_STATE.breakTypes.map((bt, i) => `
                  <label class="cursor-pointer border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 p-3 rounded-xl flex flex-col hover:border-slate-900 transition">
                    <div class="flex items-center justify-between">
                      <span class="font-bold text-xs text-slate-900 dark:text-white">${bt.name}</span>
                      <input type="radio" name="selected_bt" value="${bt.name}" data-max="${bt.maxMinutes}" ${i===0?'checked':''} class="text-slate-900">
                    </div>
                    <span class="text-[11px] text-slate-500 mt-1">Maks: ${bt.maxMinutes} menit</span>
                  </label>
                `).join('')}
              </div>
            </div>

            <button onclick="executeStartBreak('${crew.crewId}')" class="w-full py-4 ${accent.bg} text-white font-bold rounded-2xl shadow-lg transition">
              MULAI BREAK (START BREAK)
            </button>
          </div>
        `;
      }

    function processScanBarcode(code) {
      const cleanCode = code.trim();
      const crew = APP_STATE.crews.find(c => c.crewId.toLowerCase() === cleanCode.toLowerCase() || c.id === cleanCode);
      if (crew) {
        APP_STATE.activeScanResult = crew;
        showToast(`Crew ${crew.name} terdeteksi!`, 'success');
        renderApp();
      } else {
        showToast(`Barcode / ID "${cleanCode}" tidak ditemukan.`, 'error');
      }
    }

    function clearScanResult() {
      APP_STATE.activeScanResult = null;
      renderApp();
    }

    function executeStartBreak(crewId) {
      const crew = APP_STATE.crews.find(c => c.crewId === crewId);
      if (!crew) return;

      const checkedRadio = document.querySelector('input[name="selected_bt"]:checked');
      const breakTypeName = checkedRadio ? checkedRadio.value : 'Meal Break';
      const maxMins = checkedRadio ? parseInt(checkedRadio.getAttribute('data-max')) : 45;

      const newBreak = {
        id: 'brk_' + Date.now(),
        crewId: crew.crewId,
        crewName: crew.name,
        position: crew.position,
        breakType: breakTypeName,
        maxMinutes: maxMins,
        startTime: new Date().toISOString(),
        endTime: null,
        durationSeconds: null,
        startedBy: APP_STATE.currentUser.email || APP_STATE.currentUser.crewId,
        endedBy: null,
        status: 'ON BREAK',
        date: new Date().toISOString().split('T')[0]
      };

      APP_STATE.breaks.unshift(newBreak);
      saveData();
      showToast(`Break dimulai untuk ${crew.name} (${breakTypeName})`, 'success');
      APP_STATE.activeScanResult = null;
      renderApp();
    }

    function executeEndBreak(breakId) {
      const b = APP_STATE.breaks.find(item => item.id === breakId);
      if (!b) return;

      const nowIso = new Date().toISOString();
      const startMs = new Date(b.startTime).getTime();
      const endMs = new Date(nowIso).getTime();
      const durationSec = Math.max(1, Math.floor((endMs - startMs) / 1000));

      b.endTime = nowIso;
      b.durationSeconds = durationSec;
      b.status = 'COMPLETED';
      b.endedBy = APP_STATE.currentUser.email || APP_STATE.currentUser.crewId;

      saveData();
      showToast(`Break selesai untuk ${b.crewName} (${formatDuration(durationSec)})`, 'success');
      APP_STATE.activeScanResult = null;
      renderApp();
    }

            <div class="bg-white dark:bg-slate-800 rounded-3xl p-12 text-center border border-slate-200 dark:border-slate-700">
              <i class="fa-solid fa-mug-hot text-4xl text-slate-300 mb-3"></i>
              <h3 class="font-bold text-slate-800 dark:text-slate-200 text-base">Tidak ada sesi aktif</h3>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${activeBreaks.map(b => {
                const elapsed = getElapsedTimeInSeconds(b.startTime);
                const limitSec = (b.maxMinutes || 30) * 60;

    function approveRequest(reqId) {
      const req = APP_STATE.requests.find(r => r.id === reqId);
      if (!req) return;

      req.status = 'APPROVED';
      const crew = APP_STATE.crews.find(c => c.crewId === req.crewId);

      if (crew) {
        if (req.type === 'PASSWORD_RESET' || req.field === 'password') {
          crew.password = req.newValue || crew.crewId;
        } else if (req.field === 'name') crew.name = req.newValue;
        else if (req.field === 'position') crew.position = req.newValue;
        else if (req.field === 'department') crew.department = req.newValue;
        else if (req.field === 'phone') crew.phone = req.newValue;
        else if (req.field === 'photo') crew.photo = req.photo || req.newValue;
      }

      saveData();
      showToast(`Pengajuan ${req.crewName} telah DI-ACC! Data tersimpan permanent.`, 'success');
      renderApp();
    }

    function rejectRequest(reqId) {
      const req = APP_STATE.requests.find(r => r.id === reqId);
      if (!req) return;

      req.status = 'REJECTED';
      saveData();
      showToast(`Pengajuan ${req.crewName} ditolak.`, 'info');
      renderApp();
    }

    let tempStatusPhotoBase64 = '';

          tempStatusPhotoBase64 = evt.target.result;
          const box = document.getElementById('status-photo-preview-box');
          const img = document.getElementById('status-photo-preview');
          if (box && img) {

        reader.readAsDataURL(file);

        authorName: APP_STATE.currentUser.name,
        authorRole: APP_STATE.currentUser.roleType,
        text,
        photo: tempStatusPhotoBase64,
        createdAt: new Date().toISOString()

      APP_STATE.statuses.unshift(newPost);
      saveData();
      tempStatusPhotoBase64 = '';
      showToast('Status berhasil dipublikasikan!', 'success');
      renderApp();
    }

    let tempReqPhotoBase64 = '';
    function previewReqPhoto(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          tempReqPhotoBase64 = evt.evt.result || evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function toggleReqFieldInputs() {
      const field = document.getElementById('req-field').value;
      const valBox = document.getElementById('req-value-box');
      const photoBox = document.getElementById('req-photo-box');

      if (field === 'photo') {
        valBox.classList.add('hidden');
        photoBox.classList.remove('hidden');
      } else {
        valBox.classList.remove('hidden');
        photoBox.classList.add('hidden');
      }
    }

    function handleCrewSubmitRequest(e) {
      e.preventDefault();
      const crew = APP_STATE.currentUser;
      const field = document.getElementById('req-field').value;
      const newValue = document.getElementById('req-new-value').value.trim();
      const desc = document.getElementById('req-desc').value.trim();

      const newReq = {
        id: 'req_' + Date.now(),
        crewId: crew.crewId,
        crewName: crew.name,
        type: 'PERUBAHAN DATA',
        field,
        newValue: field === 'photo' ? '' : newValue,
        photo: field === 'photo' ? tempReqPhotoBase64 : '',
        description: desc || `Permintaan ubah ${field} menjadi: ${newValue}`,
        status: 'PENDING',
        date: new Date().toISOString().split('T')[0]
      };

      APP_STATE.requests.unshift(newReq);
      saveData();
      tempReqPhotoBase64 = '';
      showToast('Pengajuan berhasil dikirim! Menunggu ACC Admin.', 'success');
      renderApp();
    }

    function handleAddBreakType(e) {
      e.preventDefault();
      const name = document.getElementById('new-bt-name').value.trim();
      const maxMinutes = parseInt(document.getElementById('new-bt-max').value);
      if (!name || isNaN(maxMinutes)) return;

      APP_STATE.breakTypes.push({ id: 'bt_' + Date.now(), name, maxMinutes });
      saveData();
      showToast('Jenis break baru berhasil ditambahkan!', 'success');
      renderApp();
    }

    function openEditBreakTypeModal(id) {
      const bt = APP_STATE.breakTypes.find(item => item.id === id);
      if (!bt) return;

      const modal = document.createElement('div');
      modal.id = 'dynamic-modal';
      modal.className = 'fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4';
      modal.innerHTML = `
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl border border-slate-200 dark:border-slate-700">
          <h3 class="font-bold text-lg text-slate-900 dark:text-white">Edit Jam Break</h3>
          <input type="text" id="edit-bt-name" value="${bt.name}" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs">
          <input type="number" id="edit-bt-max" value="${bt.maxMinutes}" min="1" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs">
          <div class="flex gap-2 pt-2">
            <button onclick="saveEditBreakType('${bt.id}')" class="flex-1 py-3 bg-slate-900 text-white font-bold rounded-xl text-xs">Simpan</button>
            <button onclick="document.getElementById('dynamic-modal').remove()" class="py-3 px-4 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs">Batal</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function saveEditBreakType(id) {
      const bt = APP_STATE.breakTypes.find(item => item.id === id);
      if (bt) {
        bt.name = document.getElementById('edit-bt-name').value.trim();
        bt.maxMinutes = parseInt(document.getElementById('edit-bt-max').value);
        saveData();
        document.getElementById('dynamic-modal').remove();
        showToast('Jenis break diperbarui!', 'success');
        renderApp();
      }
    }

    function deleteBreakType(id) {
      if (APP_STATE.breakTypes.length <= 1) return showToast('Minimal harus ada 1 jenis break!', 'error');
      APP_STATE.breakTypes = APP_STATE.breakTypes.filter(bt => bt.id !== id);
      saveData();
      showToast('Jenis break dihapus.', 'info');
      renderApp();
    }

      e.preventDefault();
      if (APP_STATE.admins.length >= 5) return showToast('Maksimal 5 admin!', 'error');

      const name = document.getElementById('new-adm-name').value.trim();
      const email = document.getElementById('new-adm-email').value.trim();
      const password = document.getElementById('new-adm-pass').value.trim();
      const phone = document.getElementById('new-adm-phone').value.trim();

      if (APP_STATE.admins.some(a => a.email.toLowerCase() === email.toLowerCase())) {

      APP_STATE.admins.push({ id: 'adm_' + Date.now(), name, email, password, phone, role: 'Admin', createdAt: new Date().toISOString().split('T')[0] });

      showToast('Admin berhasil ditambahkan!', 'success');
      renderApp();

            </div>

            <div>
              <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Upload Logo Foto</label>
              <input type="file" id="setting-logo-file" accept="image/*" onchange="previewCompanyLogo(event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-900 file:text-white">
              <div class="mt-3 ${APP_STATE.settings.companyLogo ? '' : 'hidden'}" id="logo-preview-container">
                <img id="logo-preview" src="${APP_STATE.settings.companyLogo}" class="w-16 h-16 object-cover rounded-2xl border">
              </div>
            </div>

            <button type="submit" class="w-full py-4 ${accent.bg} text-white font-bold rounded-2xl shadow-lg transition text-sm">
              Simpan Pengaturan
            </button>
          </form>
        </div>
      `;
    }

    let tempCompanyLogoBase64 = APP_STATE.settings.companyLogo;
    function previewCompanyLogo(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          tempCompanyLogoBase64 = e.target.result;
          const container = document.getElementById('logo-preview-container');
          const img = document.getElementById('logo-preview');
          if (container && img) {
            img.src = tempCompanyLogoBase64;
            container.classList.remove('hidden');
          }
        };
        reader.readAsDataURL(file);
      }
    }

    function handleSaveSettings(e) {
      e.preventDefault();
      APP_STATE.settings.appTitle = document.getElementById('setting-app-title').value.trim();
      APP_STATE.settings.companyName = document.getElementById('setting-company').value.trim();
      APP_STATE.settings.companyLogo = tempCompanyLogoBase64;
      saveData();
      showToast('Pengaturan disimpan!', 'success');
      renderApp();
    }

    /* MODALS & ACTIONS */
    function openAddCrewModal() {
      const modal = document.createElement('div');
      modal.id = 'dynamic-modal';
      modal.className = 'fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4';
      modal.innerHTML = `
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200 dark:border-slate-700">
          <h3 class="font-bold text-lg text-slate-900 dark:text-white">Tambah Crew Baru</h3>
          <form onsubmit="handleCreateCrew(event)" class="space-y-3">
            <input type="text" id="add-crew-id" required value="CRW0${APP_STATE.crews.length + 1}" class="w-full p-3 bg-slate-100 dark:bg-slate-900 border rounded-xl text-xs font-mono font-bold" readonly>
            <input type="text" id="add-crew-name" required placeholder="Nama Lengkap" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border rounded-xl text-xs">
            <input type="text" id="add-crew-pos" required placeholder="Posisi (Barista/Cashier)" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border rounded-xl text-xs">
            <input type="text" id="add-crew-dept" required placeholder="Departemen (Service/Kitchen)" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border rounded-xl text-xs">
            <input type="text" id="add-crew-phone" required placeholder="No HP/WhatsApp" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border rounded-xl text-xs">
            
            <div class="flex gap-2 pt-2">
              <button type="submit" class="flex-1 py-3 bg-slate-900 text-white font-bold rounded-xl text-xs">Daftarkan Crew</button>
              <button type="button" onclick="document.getElementById('dynamic-modal').remove()" class="py-3 px-4 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs">Batal</button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function handleCreateCrew(e) {
      e.preventDefault();
      const crewId = document.getElementById('add-crew-id').value.trim();
      const name = document.getElementById('add-crew-name').value.trim();
      const position = document.getElementById('add-crew-pos').value.trim();
      const department = document.getElementById('add-crew-dept').value.trim();
      const phone = document.getElementById('add-crew-phone').value.trim();

      const newCrew = {
        id: 'crw_' + Date.now(),
        crewId,
        name,
        position,
        department,
        phone,
        password: crewId, // Default password is ID Crew
        photo: '',
        status: 'Active',
        createdAt: new Date().toISOString().split('T')[0]
      };

      APP_STATE.crews.push(newCrew);
      saveData();
      document.getElementById('dynamic-modal').remove();
      showToast(`Crew ${name} berhasil ditambahkan! Sandi awal: ${crewId}`, 'success');
      renderApp();
    }

    function openBarcodeModal(crewId) {
      const crew = APP_STATE.crews.find(c => c.crewId === crewId);
      if (!crew) return;

      const modal = document.createElement('div');
      modal.id = 'dynamic-modal';
      modal.className = 'fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4';
      modal.innerHTML = `
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl border border-slate-200 dark:border-slate-700 text-center">
          <h3 class="font-bold text-lg text-slate-900 dark:text-white">${crew.name}</h3>
          <p class="text-xs text-slate-500">${crew.position} (${crew.crewId})</p>
          
          <div class="bg-white p-4 rounded-2xl border border-slate-200 flex flex-col items-center justify-center">
            <div id="modal-qrcode-box" class="w-48 h-48 flex items-center justify-center"></div>
            <span class="mt-2 text-xs font-mono font-bold text-slate-700">${crew.crewId}</span>
          </div>

          <div class="flex gap-2">
            <button onclick="downloadCrewBarcode('${crew.crewId}')" class="flex-1 py-3 bg-slate-900 text-white font-bold rounded-xl text-xs">Download Barcode</button>
            <button onclick="document.getElementById('dynamic-modal').remove()" class="py-3 px-4 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs">Tutup</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      
      setTimeout(() => {
        const qrContainer = document.getElementById('modal-qrcode-box');
        if (qrContainer) {
          qrContainer.innerHTML = '';
          new QRCode(qrContainer, {
            text: crew.crewId,
            width: 170,
            height: 170,
            colorDark: "#020617",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      }, 50);
    }

    function openManualInputModal() {
      const modal = document.createElement('div');
      modal.id = 'dynamic-modal';
      modal.className = 'fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4';
      modal.innerHTML = `
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl border border-slate-200 dark:border-slate-700">
          <h3 class="font-bold text-lg text-slate-900 dark:text-white">Input ID Manual</h3>
          <input type="text" id="manual-crew-input" placeholder="CRW001" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm uppercase font-mono">
          <div class="flex gap-2">
            <button onclick="submitManualInput()" class="flex-1 py-3 bg-slate-900 text-white font-bold rounded-xl text-xs">Proses Scan</button>
            <button onclick="document.getElementById('dynamic-modal').remove()" class="py-3 px-4 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs">Batal</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function submitManualInput() {
      const val = document.getElementById('manual-crew-input').value.trim();
      if (val) {
        document.getElementById('dynamic-modal').remove();
        processScanBarcode(val);
        if (APP_STATE.activeTab !== 'scan') switchTab('scan');
      }
    }

    function openEditCrewModal(id) {
      const crew = APP_STATE.crews.find(c => c.id === id);
      if (!crew) return;

      const modal = document.createElement('div');
      modal.id = 'dynamic-modal';
      modal.className = 'fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4';
      modal.innerHTML = `
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200 dark:border-slate-700">
          <h3 class="font-bold text-lg text-slate-900 dark:text-white">Edit Data & Sandi Crew</h3>
          <div class="space-y-3">
            <input type="text" id="edit-name" value="${crew.name}" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border rounded-xl text-xs">
            <input type="text" id="edit-pos" value="${crew.position}" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border rounded-xl text-xs">
            <input type="text" id="edit-dept" value="${crew.department}" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border rounded-xl text-xs">
            <input type="text" id="edit-pass" value="${crew.password || crew.crewId}" placeholder="Sandi Login Crew" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border rounded-xl text-xs">
          </div>
          <div class="flex gap-2 pt-2">
            <button onclick="saveEditCrew('${crew.id}')" class="flex-1 py-3 bg-slate-900 text-white font-bold rounded-xl text-xs">Simpan Permanen</button>
            <button onclick="document.getElementById('dynamic-modal').remove()" class="py-3 px-4 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs">Batal</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function saveEditCrew(id) {
      const crew = APP_STATE.crews.find(c => c.id === id);
      if (crew) {
        crew.name = document.getElementById('edit-name').value.trim();
        crew.position = document.getElementById('edit-pos').value.trim();
        crew.department = document.getElementById('edit-dept').value.trim();
        crew.password = document.getElementById('edit-pass').value.trim();
        saveData();
        document.getElementById('dynamic-modal').remove();
        showToast('Data crew berhasil diperbarui permanen!', 'success');
        renderApp();
      }
    }

    function deleteCrew(id) {
      if (confirm('Hapus crew dari database?')) {
        APP_STATE.crews = APP_STATE.crews.filter(c => c.id !== id);
        saveData();
        showToast('Crew dihapus.', 'info');
        renderApp();
      }
    }

    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input || !icon) return;

      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function exportHistoryExcel() {
      const ws = XLSX.utils.json_to_sheet(APP_STATE.breaks);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "BreakHistory");
      XLSX.writeFile(wb, "Crew_Break_History.xlsx");
      showToast('File Excel berhasil diunduh!', 'success');
    }

    function switchTab(tabId) {
      if (APP_STATE.scanner && tabId !== 'scan') {
        stopScanner();
      }
      APP_STATE.activeTab = tabId;
      renderApp();
      window.scrollTo(0, 0);
    }

    function renderApp() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      if (!APP_STATE.currentUser) {
        appEl.innerHTML = renderLoginView();
        return;
      }

      let contentHtml = '';
      const tab = APP_STATE.activeTab;

      if (APP_STATE.currentUser.roleType === 'admin') {
        switch (tab) {
          case 'dashboard': contentHtml = renderDashboardView(); break;
          case 'scan': contentHtml = renderScanView(); break;
          case 'active': contentHtml = renderActiveView(); break;
          case 'history': contentHtml = renderHistoryView(); break;
          case 'crews': contentHtml = renderCrewsView(); break;
          case 'approvals': contentHtml = renderApprovalsView(); break;
          case 'statuses': contentHtml = renderStatusesView(); break;
          case 'breakTypes': contentHtml = renderBreakTypesView(); break;
          case 'admins': contentHtml = renderAdminsView(); break;
          case 'settings': contentHtml = renderSettingsView(); break;
          default: contentHtml = renderDashboardView();
        }
      } else {
        switch (tab) {
          case 'crew_dashboard': contentHtml = renderCrewDashboardView(); break;
          case 'crew_breaks': contentHtml = renderCrewBreaksView(); break;
          case 'crew_requests': contentHtml = renderCrewRequestsView(); break;
          case 'statuses': contentHtml = renderStatusesView(); break;
          case 'crew_profile': contentHtml = renderCrewProfileView(); break;
          default: contentHtml = renderCrewDashboardView();
        }
      }

      appEl.innerHTML = `
        ${renderNavigation()}
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
          ${contentHtml}
        </main>
      `;

      if (tab === 'crew_profile') {
        setTimeout(() => {
          const qrBox = document.getElementById('crew-self-qrcode-box');
          if (qrBox && APP_STATE.currentUser.crewId) {
            qrBox.innerHTML = '';
            new QRCode(qrBox, {
              text: APP_STATE.currentUser.crewId,
              width: 170,
              height: 170,
              colorDark: "#020617",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.H
            });
          }
        }, 50);
      }

      startLiveTimers();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSeedData();
      renderApp();
    });
  </script>
</body>
</html>
